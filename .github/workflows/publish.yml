name: Publish site
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/design/**"
      - "docs/qa/**"
      - "experiments/**"
      - "docs/planning/ci-efficiency.json"
      - "docs/planning/offline-web-linear-map.json"
      - "docs/planning/*performance*.json"
  workflow_dispatch:
permissions:
  contents: read
# Serialize verification and deployment so older builds cannot overtake newer ones.
concurrency:
  group: site-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/docs/qa/
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: bun gh
      - name: Reuse the exact verified PR artifact
        id: reuse
        if: github.event_name == 'push'
        run: bun scripts/reuse-site-artifact.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the verified static build
        if: steps.reuse.outputs.reused == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: verified-site
          path: dist
          retention-days: 14
  verify:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.reused != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/web.yml
    with:
      publish-site: true
  deploy:
    needs: [prepare, verify]
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.reused == 'true' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    environment:
      name: cloudflare-production
      url: https://timetolocal.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/docs/qa/
          sparse-checkout-cone-mode: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-site
          path: verified-site
      - name: Extract the verified build
        run: |
          mkdir -p dist
          tar -xf verified-site/artifact.tar -C dist
          bun -e 'const release = await Bun.file("dist/release.json").json(); if (release.base !== "/" || !/^[a-f0-9]{40}$/.test(release.sourceCommit)) throw new Error("Invalid production release");'
      - name: Publish verified static assets
        run: bunx wrangler deploy
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f72185d2a10d3f9faf2b8799ff614dd1
